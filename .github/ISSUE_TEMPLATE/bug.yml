name: 🐛 Relatar um problema
description: Algo não funcionou como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por testar o Paid Traffic Agent (beta)! 🐉
        **⚠️ Nunca cole tokens, chaves de API, o arquivo `trafego.local.json` ou dados de clientes aqui.** Issues são públicas.
  - type: dropdown
    id: parte
    attributes:
      label: Em qual parte?
      options: ["🏠 Início", "🧬 Clonador", "📣 Gerenciador de anúncios", "💰 UTMFy", "Instalação"]
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options: ["Windows", "macOS (Apple Silicon M1/M2/M3/M4)", "macOS (Intel)", "Linux"]
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Minerador
      description: "Aparece no rodapé do menu lateral, por exemplo v0.1.0-beta"
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: O que você fez, o que esperava e o que apareceu.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Mensagens da janela preta (Terminal)
      description: Copie as últimas linhas. Apague qualquer token antes de enviar.
      render: text
